openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Talent Graph API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: candidates
    description: Candidate (Talent Graph node) operations
  - name: roles
    description: Open role operations
  - name: clients
    description: Hiring client operations
  - name: scores
    description: Candidate scoring and pipeline operations
  - name: trust
    description: Trust Graph operations
  - name: referrals
    description: Referral network operations
  - name: placements
    description: Placement and revenue operations
  - name: analytics
    description: Analytics and dashboard operations
  - name: auth
    description: Authentication and account operations
  - name: portal
    description: Referrer portal operations
  - name: clientPortal
    description: Client portal operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /candidates:
    get:
      operationId: listCandidates
      tags: [candidates]
      summary: List candidates with optional filters
      parameters:
        - { name: search, in: query, required: false, schema: { type: string } }
        - { name: status, in: query, required: false, schema: { type: string } }
        - { name: source, in: query, required: false, schema: { type: string } }
        - { name: skill, in: query, required: false, schema: { type: string } }
        - { name: location, in: query, required: false, schema: { type: string } }
        - { name: minComp, in: query, required: false, schema: { type: number } }
        - { name: maxComp, in: query, required: false, schema: { type: number } }
        - { name: sort, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: List of candidates
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CandidateListItem" }
    post:
      operationId: createCandidate
      tags: [candidates]
      summary: Create a candidate
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CandidateInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Candidate" }

  /candidates/{id}:
    get:
      operationId: getCandidate
      tags: [candidates]
      summary: Get full candidate profile
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Candidate profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Candidate" }
        "404": { description: Not found }
    put:
      operationId: updateCandidate
      tags: [candidates]
      summary: Update candidate
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CandidateUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Candidate" }
    delete:
      operationId: deleteCandidate
      tags: [candidates]
      summary: Delete candidate
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Deleted }

  /candidates/{id}/trust-graph:
    get:
      operationId: getCandidateTrustGraph
      tags: [trust]
      summary: Get trust edges around a candidate
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Trust subgraph
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrustGraph" }

  /candidates/{id}/dossier/{roleId}:
    get:
      operationId: getCandidateDossier
      tags: [candidates]
      summary: Generate dossier data for a candidate-role pair
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: roleId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Dossier data
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dossier" }
        "404": { description: Not found }

  /roles:
    get:
      operationId: listRoles
      tags: [roles]
      summary: List roles with optional filters
      parameters:
        - { name: status, in: query, required: false, schema: { type: string } }
        - { name: department, in: query, required: false, schema: { type: string } }
        - { name: level, in: query, required: false, schema: { type: string } }
        - { name: clientId, in: query, required: false, schema: { type: string } }
        - { name: published, in: query, required: false, schema: { type: boolean } }
      responses:
        "200":
          description: List of roles
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RoleListItem" }
    post:
      operationId: createRole
      tags: [roles]
      summary: Create a role
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoleInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Role" }

  /roles/{id}:
    get:
      operationId: getRole
      tags: [roles]
      summary: Get role detail with pipeline stats
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Role detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Role" }
        "404": { description: Not found }
    put:
      operationId: updateRole
      tags: [roles]
      summary: Update role
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoleUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Role" }

  /roles/{id}/pipeline:
    get:
      operationId: getRolePipeline
      tags: [roles]
      summary: Get candidate scores for a role grouped by stage
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Pipeline
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PipelineCard" }

  /roles/{id}/match:
    post:
      operationId: matchRole
      tags: [roles]
      summary: Find matching candidates from the Talent Graph
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Ranked matching candidates
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MatchResult" }

  /scores:
    post:
      operationId: upsertScore
      tags: [scores]
      summary: Create or update a candidate score for a role
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScoreInput" }
      responses:
        "200":
          description: Score
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CandidateScore" }

  /scores/{id}/stage:
    put:
      operationId: updateScoreStage
      tags: [scores]
      summary: Move a candidate to a new pipeline stage
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StageUpdate" }
      responses:
        "200":
          description: Updated score
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CandidateScore" }
        "400": { description: Rule violation }

  /trust-graph:
    get:
      operationId: getTrustGraph
      tags: [trust]
      summary: Full trust graph for visualization
      parameters:
        - { name: relationship, in: query, required: false, schema: { type: string } }
        - { name: status, in: query, required: false, schema: { type: string } }
        - { name: minWeight, in: query, required: false, schema: { type: number } }
      responses:
        "200":
          description: Graph data
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrustGraph" }

  /trust-edges:
    post:
      operationId: createTrustEdge
      tags: [trust]
      summary: Create a trust edge (auto-creates reverse for worked_with)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TrustEdgeInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrustEdge" }

  /trust-edges/{id}:
    delete:
      operationId: deleteTrustEdge
      tags: [trust]
      summary: Delete a trust edge
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Deleted }

  /referrals:
    get:
      operationId: listReferrals
      tags: [referrals]
      summary: List referrals
      parameters:
        - { name: referrerId, in: query, required: false, schema: { type: string } }
        - { name: status, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: List of referrals
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Referral" }
    post:
      operationId: createReferral
      tags: [referrals]
      summary: Submit a referral (enforces anti-abuse rules)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReferralInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Referral" }
        "400": { description: Rule violation }

  /referrals/{id}:
    put:
      operationId: updateReferral
      tags: [referrals]
      summary: Update referral status (recalculates scout score)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReferralUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Referral" }

  /referrals/leaderboard:
    get:
      operationId: getLeaderboard
      tags: [referrals]
      summary: Scout score leaderboard
      responses:
        "200":
          description: Leaderboard
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/LeaderboardEntry" }

  /clients:
    get:
      operationId: listClients
      tags: [clients]
      summary: List clients with stats
      responses:
        "200":
          description: List of clients
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ClientListItem" }
    post:
      operationId: createClient
      tags: [clients]
      summary: Create a client
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClientInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Client" }

  /clients/{id}:
    get:
      operationId: getClient
      tags: [clients]
      summary: Client detail with roles and placements
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Client detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Client" }
        "404": { description: Not found }
    put:
      operationId: updateClient
      tags: [clients]
      summary: Update client
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClientUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Client" }

  /placements:
    get:
      operationId: listPlacements
      tags: [placements]
      summary: List placements
      responses:
        "200":
          description: List of placements
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Placement" }
    post:
      operationId: createPlacement
      tags: [placements]
      summary: Create a placement (calculates fee, updates statuses)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlacementInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Placement" }

  /placements/{id}:
    put:
      operationId: updatePlacement
      tags: [placements]
      summary: Update placement status
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlacementUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Placement" }

  /dashboard:
    get:
      operationId: getDashboard
      tags: [analytics]
      summary: Dashboard KPIs, funnel, revenue tracker
      responses:
        "200":
          description: Dashboard data
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dashboard" }

  /activity:
    get:
      operationId: listActivity
      tags: [analytics]
      summary: Recent activity feed
      responses:
        "200":
          description: Activity feed
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Activity" }

  /analytics/revenue:
    get:
      operationId: getRevenueAnalytics
      tags: [analytics]
      summary: Revenue analytics
      responses:
        "200":
          description: Revenue analytics
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RevenueAnalytics" }

  /analytics/pipeline:
    get:
      operationId: getPipelineAnalytics
      tags: [analytics]
      summary: Pipeline funnel analytics
      responses:
        "200":
          description: Pipeline analytics
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PipelineAnalytics" }

  /analytics/sources:
    get:
      operationId: getSourceAnalytics
      tags: [analytics]
      summary: Candidate source analytics
      responses:
        "200":
          description: Source analytics
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SourceAnalytics" }

  /analytics/referrals:
    get:
      operationId: getReferralAnalytics
      tags: [analytics]
      summary: Referral network analytics
      responses:
        "200":
          description: Referral analytics
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReferralAnalytics" }

  /auth/register:
    post:
      operationId: registerUser
      tags: [auth]
      summary: Register a new referrer account (clients join by admin invite only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterInput" }
      responses:
        "201":
          description: Created account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthUser" }

  /auth/login:
    post:
      operationId: loginUser
      tags: [auth]
      summary: Log in with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginInput" }
      responses:
        "200":
          description: Authenticated user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthUser" }

  /auth/logout:
    post:
      operationId: logoutUser
      tags: [auth]
      summary: Log out the current session
      responses:
        "204":
          description: Logged out

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get the currently authenticated user
      responses:
        "200":
          description: Authenticated user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthUser" }

  /auth/verify-email:
    post:
      operationId: verifyEmail
      tags: [auth]
      summary: Verify an email address with a token from the verification email
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VerifyEmailInput" }
      responses:
        "200":
          description: Authenticated, verified user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthUser" }

  /auth/resend-verification:
    post:
      operationId: resendVerification
      tags: [auth]
      summary: Resend the verification email to the current user
      responses:
        "200":
          description: Verification email resent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageResponse" }

  /auth/request-password-reset:
    post:
      operationId: requestPasswordReset
      tags: [auth]
      summary: Request a password reset email
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RequestPasswordResetInput" }
      responses:
        "200":
          description: Reset email sent if the account exists
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageResponse" }

  /auth/reset-password:
    post:
      operationId: resetPassword
      tags: [auth]
      summary: Set a new password using a reset token
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResetPasswordInput" }
      responses:
        "200":
          description: Password updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageResponse" }

  /auth/invite/{token}:
    get:
      operationId: getInvite
      tags: [auth]
      summary: Preview an invite (email, name, company) before accepting
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Invite details
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvitePreview" }

  /auth/accept-invite:
    post:
      operationId: acceptInvite
      tags: [auth]
      summary: Accept a client invite by setting a password
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AcceptInviteInput" }
      responses:
        "200":
          description: Authenticated, activated user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthUser" }

  /clients/{id}/invite:
    post:
      operationId: inviteClientUser
      tags: [clients]
      summary: Invite a user to a client (company) account
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InviteClientInput" }
      responses:
        "201":
          description: Invitation sent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageResponse" }

  /portal/roles:
    get:
      operationId: listPortalRoles
      tags: [portal]
      summary: Roles published to the referral network (industry-anonymised)
      responses:
        "200":
          description: Published roles
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PortalRole" }

  /portal/referrals:
    get:
      operationId: listMyReferrals
      tags: [portal]
      summary: Referrals submitted by the current referrer
      responses:
        "200":
          description: My referrals
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Referral" }
    post:
      operationId: createMyReferral
      tags: [portal]
      summary: Submit a referral to a published role
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PortalReferralInput" }
      responses:
        "201":
          description: Created referral
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Referral" }

  /portal/score:
    get:
      operationId: getMyScoutScore
      tags: [portal]
      summary: Scout score and standing for the current referrer
      responses:
        "200":
          description: Scout score detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScoutScoreDetail" }

  /client-portal/roles:
    get:
      operationId: listClientRoles
      tags: [clientPortal]
      summary: Roles belonging to the current client
      responses:
        "200":
          description: Client roles with pipeline summary
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Role" }

  /client-portal/placements:
    get:
      operationId: listClientPlacements
      tags: [clientPortal]
      summary: Placements belonging to the current client
      responses:
        "200":
          description: Client placements
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Placement" }

  /client-portal/shortlist:
    get:
      operationId: listClientShortlist
      tags: [clientPortal]
      summary: Shortlisted candidates across the current client's roles
      responses:
        "200":
          description: Shortlisted candidates
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ClientShortlistItem" }

  /client-portal/dossier/{candidateId}/{roleId}:
    get:
      operationId: getClientDossier
      tags: [clientPortal]
      summary: Read-only dossier for a candidate shortlisted on a client role
      parameters:
        - { name: candidateId, in: path, required: true, schema: { type: string } }
        - { name: roleId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Dossier data
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dossier" }

  /admin/people:
    get:
      operationId: getPlatformPeople
      tags: [admin]
      summary: Platform roster of referrer and client accounts (owner view)
      responses:
        "200":
          description: Referrer and client accounts on the platform
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformPeople" }

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status: { type: string }
      required: [status]

    AuthUser:
      type: object
      required: [id, name, email, role, emailVerified]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string }
        role: { type: string, enum: [ADMIN, CLIENT, REFERRER] }
        emailVerified: { type: boolean }
        referrerCandidateId: { type: ["string", "null"] }
        clientId: { type: ["string", "null"] }
        clientName: { type: ["string", "null"] }

    MessageResponse:
      type: object
      required: [message]
      properties:
        message: { type: string }

    VerifyEmailInput:
      type: object
      required: [token]
      properties:
        token: { type: string }

    RequestPasswordResetInput:
      type: object
      required: [email]
      properties:
        email: { type: string }

    ResetPasswordInput:
      type: object
      required: [token, password]
      properties:
        token: { type: string }
        password: { type: string }

    AcceptInviteInput:
      type: object
      required: [token, password]
      properties:
        token: { type: string }
        password: { type: string }

    InvitePreview:
      type: object
      required: [email, name, companyName]
      properties:
        email: { type: string }
        name: { type: string }
        companyName: { type: string }

    InviteClientInput:
      type: object
      required: [name, email]
      properties:
        name: { type: string }
