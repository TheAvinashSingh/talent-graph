      properties:
        funnel:
          type: array
          items: { $ref: "#/components/schemas/FunnelStage" }
        bottleneckStage: { type: ["string", "null"] }

    SourceAnalytics:
      type: object
      required: [bySource]
      properties:
        bySource:
          type: array
          items: { $ref: "#/components/schemas/SourceStat" }

    SourceStat:
      type: object
      required: [source, count, hires]
      properties:
        source: { type: string }
        count: { type: integer }
        hires: { type: integer }
        conversionRate: { type: number }

    ReferralAnalytics:
      type: object
      required: [totalReferrers, activeReferrers, referralToHireRate, avgScoutScore, funnel]
      properties:
        totalReferrers: { type: integer }
        activeReferrers: { type: integer }
        referralToHireRate: { type: number }
        avgScoutScore: { type: number }
        funnel:
          type: array
          items: { $ref: "#/components/schemas/FunnelStage" }

    PlatformReferrer:
      type: object
      required: [userId, name, email, joinedAt, scoutScore, submitted, hired, isTalentScout]
      properties:
        userId: { type: string }
        name: { type: string }
        email: { type: string }
        joinedAt: { type: string }
        candidateId: { type: ["string", "null"] }
        candidateName: { type: ["string", "null"] }
        profileCompleteness: { type: ["integer", "null"] }
        scoutScore: { type: number }
        submitted: { type: integer }
        hired: { type: integer }
        isTalentScout: { type: boolean }

    PlatformClientAccount:
      type: object
      required: [userId, name, email, joinedAt, clientId, companyName, activeRoles, totalPlacements, totalFees]
      properties:
        userId: { type: string }
        name: { type: string }
        email: { type: string }
        joinedAt: { type: string }
        clientId: { type: string }
        companyName: { type: string }
        industry: { type: ["string", "null"] }
        clientStatus: { type: string }
        activeRoles: { type: integer }
        totalPlacements: { type: integer }
        totalFees: { type: number }

    PlatformPeople:
      type: object
      required: [referrers, clients]
      properties:
        referrers:
          type: array
          items: { $ref: "#/components/schemas/PlatformReferrer" }
        clients:
          type: array
          items: { $ref: "#/components/schemas/PlatformClientAccount" }
